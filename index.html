<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="%BASE_URL%logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="React Router SPA Supabase Template for building modern web applications" />
    <title>Mellemrum. | Find plads til noget nyt. | React Template</title>
    <script>
      (() => {
        const location = window.location;

        if (location.search.startsWith("?/")) {
          const restoredRoute = location.search
            .slice(1)
            .split("&")
            .map((part) => part.replace(/~and~/g, "&"))
            .join("?");

          window.history.replaceState(
            null,
            "",
            `${location.pathname.slice(0, -1)}${restoredRoute}${location.hash}`
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
